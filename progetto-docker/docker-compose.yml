services:
  db:
    image: mysql:9.6.0
    container_name: progetto_db
    environment:
      - MYSQL_ROOT_PASSWORD=123456
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: progetto_phpmyadmin
    environment:
      - PMA_ARBITRARY=1
    ports:
      - 4080:80

volumes:
  db_data:
